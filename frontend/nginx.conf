server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Do not tell visitors which nginx version this is
  server_tokens off;

  # Security headers. The Content Security Policy only allows our own files and
  # calls to the API on https://localhost:5000. It matches the policy in
  # public/index.html, and adds the rules a meta tag cannot set (frame-ancestors).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://localhost:5000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri /index.html;
  }
}
