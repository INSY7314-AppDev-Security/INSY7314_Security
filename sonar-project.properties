# Replace the key (and organization, if using SonarQube Cloud) with your own values.
sonar.projectKey=INSY7314-AppDev-Security_INSY7314_Security
sonar.projectName=HustleHub+
# sonar.organization=insy7314-appdev-security   # only for SonarQube Cloud
 
sonar.sources=backend/src,frontend/src
sonar.exclusions=**/node_modules/**,**/coverage/**,**/build/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/setupTests.js
sonar.tests=backend/tests,frontend/src,frontend/e2e
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js
sonar.coverage.exclusions=backend/src/seed/**
 
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
 
# Fail the CI step when the Quality Gate fails
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
