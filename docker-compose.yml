# Runs the whole HustleHub+ stack: database, backend API and frontend.
#   1. Copy .env.example to .env and fill it in
#   2. docker compose up --build
#   3. docker compose exec backend npm run seed:admin   (creates the admin user)
# Frontend: http://localhost:3000    Backend API: https://localhost:5000
name: hustlehub

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # No "ports" here: the database can only be reached by the other containers
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      LOGIN_RATE_LIMIT_MAX: 100
      MONGO_URI: mongodb://mongo:27017/hustlehub
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file next to docker-compose.yml}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in a .env file next to docker-compose.yml}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-}
      GRAFANA_LOKI_TOKEN: ${GRAFANA_LOKI_TOKEN:-}
    ports:
      - "5000:5000"
    volumes:
      - backend-logs:/app/logs

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: https://localhost:5000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  mongo-data:
  backend-logs:
