name: CI/CD Pipeline

on:
  push:
    branches: [main, ci-pipeline]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------
  # 1. BACKEND: dependency audit, unit tests, Newman integration tests
  # ---------------------------------------------------------------
  backend:
    name: Backend (unit + Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://localhost:27017/hustlehub_ci
      # Secrets come from Settings > Secrets and variables > Actions. Never hardcode.
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:unit

      - name: Generate development TLS certificate
        run: node generate-cert.js

      - name: Seed administrator
        run: npm run seed:admin

      - name: Start backend
        run: |
          nohup npm start > backend.log 2>&1 &
          npx --yes wait-on@7 tcp:localhost:5000 --timeout 60000

      - name: Newman integration tests
        run: npm run test:api:report -- --env-var "adminPassword=$ADMIN_PASSWORD"

      - name: Show backend log on failure
        if: failure()
        run: cat backend.log

      - name: Dependency audit (fails on high/critical)
        if: always()
        run: npm audit --omit=dev --audit-level=high

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: docs/newman/
          if-no-files-found: warn

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 2. FRONTEND: unit tests, production build, Playwright E2E
  # ---------------------------------------------------------------
  frontend:
    name: Frontend (unit + build + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://localhost:27017/hustlehub_e2e
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      REACT_APP_API_URL: https://localhost:5000/api
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend unit tests with coverage
        working-directory: frontend
        run: npm test -- --coverage --watchAll=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Prepare and start backend for E2E
        working-directory: backend
        run: |
          node generate-cert.js
          npm run seed:admin
          nohup npm start > backend.log 2>&1 &
          npx --yes wait-on@7 tcp:localhost:5000 --timeout 60000

      - name: Serve built frontend
        working-directory: frontend
        run: |
          nohup npx --yes serve@14 -s build -l 3000 > serve.log 2>&1 &
          npx --yes wait-on@7 tcp:localhost:3000 --timeout 60000

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright integration (E2E) tests
        working-directory: frontend
        run: npx playwright test

      - name: Show backend log on failure
        if: failure()
        run: cat backend/backend.log

      - name: Dependency audit (fails on high/critical)
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 3. SONARQUBE: static analysis + quality gate (fails the pipeline)
  #    Configured and ready. It only runs when the SONAR_TOKEN repository
  #    secret exists; without it the job skips cleanly instead of failing.
  # ---------------------------------------------------------------
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Check whether SonarQube is configured
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice title=SonarQube skipped::No SONAR_TOKEN secret is set, so the analysis was not run. Add SONAR_TOKEN and SONAR_HOST_URL as repository secrets to enable it."
          else
            echo "SonarQube token found, running analysis."
          fi

      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0 # full history required for accurate new-code detection

      - name: Download backend coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Download frontend coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6 # check the Marketplace for the latest major version
        # sonar.qualitygate.wait=true in sonar-project.properties makes this
        # step fail if the Quality Gate fails.

  # ---------------------------------------------------------------
  # 4. DOCKER BUILD: proves both images build (teammates' Dockerfiles)
  # ---------------------------------------------------------------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        if: ${{ hashFiles('docker-compose.yml', 'docker-compose.yaml', 'compose.yaml') != '' }}
        run: docker compose config --quiet

      - name: Build backend and frontend images
        if: ${{ hashFiles('docker-compose.yml', 'docker-compose.yaml', 'compose.yaml') != '' }}
        run: docker compose build